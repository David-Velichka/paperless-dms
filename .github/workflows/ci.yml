name: CI

on:
  push:
    branches: [main, "Sprint_*"]
  pull_request:
    branches: [main]

jobs:
  paperless-rest:
    name: REST server tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paperless-rest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # check = unit tests + JaCoCo report + 70% line coverage gate
      - run: ./gradlew check --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paperless-rest-coverage
          path: paperless-rest/build/reports/jacoco/test/html

  paperless-ocr-worker:
    name: OCR worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paperless-ocr-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --no-daemon

  paperless-webui:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paperless-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: paperless-webui/package-lock.json
      - run: npm ci
      # tsc type check + vite production build
      - run: npm run build

  docker-compose:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [paperless-rest, paperless-ocr-worker, paperless-webui]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
