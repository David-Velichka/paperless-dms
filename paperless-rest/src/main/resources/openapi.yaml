openapi: 3.0.3
info:
  title: Paperless REST API
  description: RESTful API for Paperless Document Management System (SWEN3 Semester Project)
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Direct Backend REST Server
  - url: http://localhost:80/api
    description: Via Nginx Reverse Proxy

paths:
  /api/documents:
    get:
      summary: Retrieve all documents
      operationId: getAllDocuments
      responses:
        '200':
          description: List of documents successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentDto'
    post:
      summary: Create new document metadata
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentDto'
      responses:
        '201':
          description: Document successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDto'

  /api/documents/upload:
    post:
      summary: Upload a document file
      description: Uploads a document file with optional title metadata, persisting initial document record
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                title:
                  type: string
                  description: Optional title for the document. Defaults to original filename.
                file:
                  type: string
                  format: binary
                  description: Binary content of document to upload
      responses:
        '201':
          description: Document successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDto'
        '400':
          description: Bad request (missing or empty file)

  /api/documents/{id}:
    get:
      summary: Retrieve document by ID
      operationId: getDocumentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDto'
        '404':
          description: Document not found
    delete:
      summary: Delete document by ID
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Document deleted

  /api/documents/search:
    get:
      summary: Full-text search for documents
      operationId: searchDocuments
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentDto'

  /api/documents/{id}/history:
    get:
      summary: Retrieve status transition history for a document
      operationId: getDocumentStatusHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Chronological list of status transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentStatusHistoryDto'

  /api/documents/{id}/status:
    post:
      summary: Transition document status
      operationId: changeDocumentStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStatusChangeRequestDto'
      responses:
        '201':
          description: Status transition recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusHistoryDto'
        '400':
          description: Invalid transition or validation error

  /api/documents/status-history/{id}:
    get:
      summary: Retrieve single status history entry by ID
      operationId: getStatusHistoryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Status history record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusHistoryDto'
        '404':
          description: History entry not found

components:
  schemas:
    DocumentStatus:
      type: string
      enum:
        - RECEIVED
        - PROCESSING
        - REVIEW_PENDING
        - COMPLETED
        - REJECTED

    DocumentDto:
      type: object
      required:
        - title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
          format: int64
        storagePath:
          type: string
        ocrText:
          type: string
        summary:
          type: string
        currentStatus:
          $ref: '#/components/schemas/DocumentStatus'
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    DocumentStatusHistoryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/DocumentStatus'
        previousStatus:
          $ref: '#/components/schemas/DocumentStatus'
        changedBy:
          type: string
        timestamp:
          type: string
          format: date-time
        comment:
          type: string

    DocumentStatusChangeRequestDto:
      type: object
      required:
        - status
        - changedBy
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
        changedBy:
          type: string
        comment:
          type: string
