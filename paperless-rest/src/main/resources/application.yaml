server:
  port: 8081

spring:
  application:
    name: paperless-rest

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    # Fail fast when the broker is down (default is 60s), the upload then returns 503
    connection-timeout: 5s
    # On an unexpected error retry 3 times (1s, 2s, 4s), then reject without requeue (no endless loop)
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    # Explicit timeouts: a down or hanging Elasticsearch fails fast instead of blocking the caller
    connection-timeout: 2s
    socket-timeout: 5s

  flyway:
    enabled: false

paperless:
  rabbitmq:
    exchange: paperless.document.exchange
    ocr-queue: paperless.ocr.queue
    ocr-routing-key: document.ocr
    ocr-result-queue: paperless.ocr.result.queue
    ocr-result-routing-key: document.ocr.result
    dead-letter-exchange: paperless.dlx
    ocr-dead-letter-queue: paperless.ocr.dlq
    ocr-dead-letter-routing-key: document.ocr.dead
    ocr-result-dead-letter-queue: paperless.ocr.result.dlq
    ocr-result-dead-letter-routing-key: document.ocr.result.dead
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    bucket: paperless-documents
    # Whole call including the SDK retries (enough for a 50 MB upload) and one single attempt
    api-call-timeout: 120s
    api-call-attempt-timeout: 30s

resilience4j:
  circuitbreaker:
    instances:
      # Opens when 50% of the last 10 searches failed (at least 5 calls), then skips Elasticsearch for 10s
      search:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

# Title and version shown in the Swagger UI (same as docs/openapi.yaml)
springdoc:
  open-api:
    info:
      title: Paperless REST API
      version: 0.4.0

logging:
  level:
    com.paperless.rest: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    # TRACE would log every bound SQL value, including the whole OCR text
    org.hibernate.orm.jdbc.bind: INFO
