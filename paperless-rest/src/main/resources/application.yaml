server:
  port: 8081

spring:
  application:
    name: paperless-rest

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    # Fail fast when the broker is down (default is 60s), the upload then returns 503
    connection-timeout: 5s
    # On an unexpected error retry 3 times (1s, 2s, 4s), then reject without requeue (no endless loop)
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2

  flyway:
    enabled: false

paperless:
  rabbitmq:
    exchange: paperless.document.exchange
    ocr-queue: paperless.ocr.queue
    ocr-routing-key: document.ocr
    ocr-result-queue: paperless.ocr.result.queue
    ocr-result-routing-key: document.ocr.result
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    bucket: paperless-documents

elasticsearch:
  uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

logging:
  level:
    com.paperless.rest: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    # TRACE would log every bound SQL value, including the whole OCR text
    org.hibernate.orm.jdbc.bind: INFO
