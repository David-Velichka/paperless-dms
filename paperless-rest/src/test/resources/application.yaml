server:
  port: 8081

spring:
  application:
    name: paperless-rest-test

  datasource:
    url: jdbc:h2:mem:paperless_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    # No broker in tests: do not start the listener container
    listener:
      simple:
        auto-startup: false

  flyway:
    enabled: false

paperless:
  rabbitmq:
    exchange: paperless.document.exchange
    ocr-queue: paperless.ocr.queue
    ocr-routing-key: document.ocr
    ocr-result-queue: paperless.ocr.result.queue
    ocr-result-routing-key: document.ocr.result
    dead-letter-exchange: paperless.dlx
    ocr-dead-letter-queue: paperless.ocr.dlq
    ocr-dead-letter-routing-key: document.ocr.dead
  rustfs:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: paperless-documents
    api-call-timeout: 120s
    api-call-attempt-timeout: 30s

resilience4j:
  circuitbreaker:
    instances:
      # Opens when 50% of the last 10 searches failed (at least 5 calls), then skips Elasticsearch for 10s
      search:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
