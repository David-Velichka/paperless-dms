server:
  port: 8081

spring:
  application:
    name: paperless-rest-test

  datasource:
    url: jdbc:h2:mem:paperless_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    # No broker in tests: do not start the listener container
    listener:
      simple:
        auto-startup: false

  flyway:
    enabled: false

paperless:
  rabbitmq:
    exchange: paperless.document.exchange
    ocr-queue: paperless.ocr.queue
    ocr-routing-key: document.ocr
    ocr-result-queue: paperless.ocr.result.queue
    ocr-result-routing-key: document.ocr.result
  rustfs:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: paperless-documents
