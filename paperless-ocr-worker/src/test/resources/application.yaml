spring:
  application:
    name: paperless-ocr-worker-test

  # No broker in unit tests: do not start the listener container
  rabbitmq:
    listener:
      simple:
        auto-startup: false

paperless:
  rabbitmq:
    exchange: paperless.document.exchange
    ocr-queue: paperless.ocr.queue
    ocr-result-queue: paperless.ocr.result.queue
    ocr-result-routing-key: document.ocr.result
  rustfs:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: paperless-documents
  ocr:
    tessdata-path: /usr/share/tesseract-ocr/5/tessdata
    language: eng
